<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina inicial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="" id="a_logo">
            <img src="img/top_imagem.png" alt="" id="logo">
        </a>
            <form action="/search" method="get" class="search-box">
            <input type="text" name="q" placeholder="O que você está buscando?" autocomplete="off" class="search-input" id="busca">
            <button type="submit" class="search-button">🔍</button>
            <ul id="sugestoes"></ul>
        </form>
        <a href="/cart/cart.html" id="a_carrinho">
            <img src="img/png-transparent-shopping-cart-icon-shopping-cart-black-design-trade-thumbnail-removebg-preview.png" alt="" id="carrinho">
        </a>
        <a href="login/login.html" id="a_usuario">
            <img src="img/456348.png" alt="" id="usuario">
        </a>
    </header>
    <main>
        <div id="fileira">
            <a href="/info_page/info_page.html">
                <div class="produto">
                    <img src="img/garrafa.jpeg" alt="">
                    <p>Garrafa térmica Stanley</p>
                    <h2>R$27,50</h2>
                </div>
            </a>
            <div class="produto">
                <img src="img/tenis.jpg" alt="">
                <p>Tenis Adidas</p>
                <h2>R$245,50</h2>
            </div>
            <div class="produto">
                <img src="img/fone_de_ouvido_bluetooth_airbuds.png" alt="">
                <p>Fone de ouvido bluetooth</p>
                <h2>R$80,00</h2>
            </div>
            <div class="produto">
                <img src="img/teclado.png" alt="">
                <p>Teclado mecânico</p>
                <h2>R$280,50</h2>
            </div>
            <div class="produto">
                <img src="img/luminaria.jpg" alt="">
                <p>luminaria</p>
                <h2>R$300,00</h2>
            </div>
            <div class="produto">
                <img src="img/air_fryer.jpg" alt="">
                <p>Air fryer</p>
                <h2>R$270,50</h2>
            </div>
        </div>
    </main>
    <footer>
        
    </footer>
    <script>
        const produtos = [
            "Garrafa térmica Stanley",
            "Tenis Adidas",
            "Fone de ouvido bluetooth",
            "Luminaria",
            "Air fryer",
            "Teclado mecânico"
        ]
        const inputBusca = document.getElementById("busca");
        const listabusca = document.getElementById("sugestoes");

        inputBusca.addEventListener("input", function(){
            const entrada = this.value.toLowerCase();
            listabusca.innerHTML = "";

            if (!entrada) return;

            const encontrado = produtos.filter(produto => produto.toLowerCase().includes(entrada)
            );

            encontrado.forEach(produto => {
                const item = document.createElement("li");
                item.textContent = produto;

                item.addEventListener("click", function(){
                    inputBusca.value = produto;
                    listabusca.innerHTML = "";
                });

                listabusca.appendChild(item);
            })
        })

        document.addEventListener("click", function(e){
            if (e.target !== inputBusca){
                listabusca.innerHTML = "";
            }
        })
    </script>
</body>
</html>
